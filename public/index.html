<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact form test</title><style>body{font:16px system-ui;background:#191919;color:white;max-width:580px;margin:60px auto;padding:20px}form{display:grid;gap:14px}input,textarea,button{padding:12px;border-radius:7px;font:inherit}button{background:#fecb00;border:0;cursor:pointer}</style></head><body><h1>Test contact form</h1><form id="contact"><input name="first_name" placeholder="First name" required maxlength="100"><input name="last_name" placeholder="Last name" required maxlength="100"><input type="email" name="email" placeholder="Email" required maxlength="254"><input name="phone" placeholder="Phone" required maxlength="25"><input name="subject" placeholder="Subject" maxlength="200"><textarea name="message" placeholder="Message" maxlength="5000"></textarea><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><button>Submit</button></form><p id="result" role="status"></p><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const result=document.querySelector('#result');result.textContent='Sending...';try{const response=await fetch('/contact',{method:'POST',body:new FormData(e.target)});const data=await response.json();result.textContent=data.message;if(response.ok)e.target.reset();}catch{result.textContent='Unable to submit.';}});</script></body></html>
